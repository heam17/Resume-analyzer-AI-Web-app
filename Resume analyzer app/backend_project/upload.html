<!DOCTYPE html>
<html>
<head>
    <title>Resume Upload</title>
</head>
<body>

<h2>Upload Resume</h2>

<form id="uploadForm">
    <input type="text" name="job_domain" placeholder="Job Domain"><br><br>
    <input type="text" name="skills" placeholder="Skills"><br><br>
    <input type="number" name="experience" placeholder="Experience"><br><br>
    <input type="text" name="job_description" placeholder="Job Description"><br><br>
    <input type="number" name="vacancy" placeholder="Vacancy"><br><br>

    <input type="file" name="files" multiple><br><br>

    <button type="submit">Upload</button>
</form>

<pre id="result"></pre>

<script>
document.getElementById("uploadForm").onsubmit = async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);

    const response = await fetch("http://127.0.0.1:8000/analyze-job", {
        method: "POST",
        body: formData
    });

    const data = await response.json();

    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
};
</script>

</body>
</html>
